name: Build APK de production

# APK de production ClosetA, pour l'usage au quotidien.
# Garde la permission Internet (nécessaire pour joindre le relais Cloudflare).
# Aucun secret n'est injecté dans l'APK : le jeton du relais se saisit dans l'app.
# Déclenchement uniquement manuel : onglet Actions > "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Supprime les warnings npm pour que expo-modules-autolinking
      # puisse parser la sortie JSON de npm list --json (erreur generateInlineModules)
      npm_config_warn: "false"

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Vérifier que les 4 secrets de signature sont présents
        run: |
          for S in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!S}" ]; then echo "ERREUR : secret $S manquant – ajoute-le dans Settings > Secrets and variables > Actions"; exit 1; fi
          done
          echo "Les 4 secrets de signature sont présents"

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Retirer l'affichage par-dessus les autres apps, injecter le versionCode
        run: |
          VERSION_CODE=$((1 + GITHUB_RUN_NUMBER))
          jq ".expo.android.blockedPermissions += [\"android.permission.SYSTEM_ALERT_WINDOW\"]
            | .expo.android.versionCode = $VERSION_CODE" app.json > app.json.tmp && mv app.json.tmp app.json
          echo "versionCode : $VERSION_CODE"
          jq ".expo.android.blockedPermissions" app.json

      - name: Générer le projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Restaurer la clé de signature
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/closeta-release.keystore

      - name: Configurer la signature de l'APK
        run: python3 .github/patch_build_gradle.py

      - name: Compiler l'APK release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon \
            -PCLOSETA_STORE_FILE=closeta-release.keystore \
            -PCLOSETA_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PCLOSETA_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PCLOSETA_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Déposer l'APK (artefact téléchargeable)
        uses: actions/upload-artifact@v7
        with:
          name: closeta-apk
          retention-days: 7
          path: android/app/build/outputs/apk/release/*.apk

      - name: Nettoyer le keystore décodé
        if: always()
        run: rm -f android/app/closeta-release.keystore
