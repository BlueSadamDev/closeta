plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.detourage'
version = '1.0.0'

android {
  namespace "expo.modules.detourage"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Détourage sur le téléphone, gratuit et hors ligne (modèle fourni par les services Google Play).
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
}
