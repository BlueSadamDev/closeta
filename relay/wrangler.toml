# Relais ClosetA (Cloudflare Worker).
# L'identifiant du compte Cloudflare n'est PAS ici : il vient de la variable CLOUDFLARE_ACCOUNT_ID
# (secret GitHub utilisé par le workflow de mise en ligne).
# Les secrets RELAY_TOKEN, ADMIN_TOKEN et SERPAPI_KEY sont saisis dans le tableau de bord Cloudflare, jamais dans ce fichier.
name = "closeta-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Limite de débit : 30 requêtes par minute et par clé (installation, ou adresse si le jeton est absent ou refusé).
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# IA de Cloudflare (Workers AI) qui décrit les photos de /identify. Offre gratuite : quota quotidien,
# arrêt net une fois atteint (aucune facture possible sur l'offre Workers gratuite).
[ai]
binding = "AI"

# Stockage temporaire des photos, le temps de la recherche Google Lens (supprimées aussitôt après).
# Le bucket est créé une fois par l'utilisateur (voir README), avec une règle de suppression après 1 jour.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "closeta-photos-temp"

# Compteur des recherches SerpApi du mois (une case par mois, globale et par installation, effacée
# d'elle-même après 40 jours) et liste des installations (empreintes des jetons, jamais les jetons).
# L'identifiant de l'espace KV n'est pas un secret : sans les accès au compte, il ne permet rien.
[[kv_namespaces]]
binding = "QUOTA"
id = "19c2c02e0f46454a82b5f9039dada99d"

# Seuil mensuel de recherches SerpApi (offre gratuite : 250). Au seuil, /identify répond « quota_atteint ».
[vars]
SERPAPI_LIMITE_MOIS = "250"
# Seuil mensuel par installation ; vide = même seuil que le global (le global reste la limite dure).
SERPAPI_LIMITE_INSTALLATION = ""
# Version minimale de l'app (ex. "1.1.0") ; vide = aucune exigence. Une app plus ancienne reçoit
# « mise_a_jour_requise » (HTTP 426). Les APK d'avant l'étape 9 n'envoient pas leur version.
VERSION_APP_MIN = ""
