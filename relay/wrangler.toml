# Relais ClosetA (Cloudflare Worker).
# L'identifiant du compte Cloudflare n'est PAS ici : il vient de la variable CLOUDFLARE_ACCOUNT_ID
# (secret GitHub utilisé par le workflow de mise en ligne).
# Le jeton RELAY_TOKEN est un secret Cloudflare, saisi dans le tableau de bord, jamais dans ce fichier.
name = "closeta-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Limite de débit : 30 requêtes par minute et par clé (jeton, ou adresse si le jeton est absent).
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
