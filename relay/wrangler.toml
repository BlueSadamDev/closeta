# Relais ClosetA (Cloudflare Worker).
# Aucun identifiant propre à un compte Cloudflare ici, pour que chacun puisse installer son propre relais :
# - l'identifiant du compte vient du secret GitHub CLOUDFLARE_ACCOUNT_ID ;
# - le nom du Worker, l'identifiant de l'espace KV et le nom du bucket R2 viennent des variables GitHub
#   RELAIS_NOM_WORKER, RELAIS_KV_ID et RELAIS_BUCKET_R2 : le workflow de mise en ligne
#   (.github/workflows/deploy-relay.yml) ajoute les blocs [[kv_namespaces]] et [[r2_buckets]] à la fin
#   de ce fichier juste avant l'envoi, et passe le nom avec « wrangler deploy --name ».
# Les secrets RELAY_TOKEN, ADMIN_TOKEN et SERPAPI_KEY sont saisis dans le tableau de bord Cloudflare, jamais dans ce fichier.
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Limite de débit : 30 requêtes par minute et par clé (installation, ou adresse si le jeton est absent ou refusé).
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# IA de Cloudflare (Workers AI) qui décrit les photos de /identify. Offre gratuite : quota quotidien,
# arrêt net une fois atteint (aucune facture possible sur l'offre Workers gratuite).
[ai]
binding = "AI"

# Ajoutés par le workflow de mise en ligne (voir en tête de fichier) :
# - [[r2_buckets]] binding "PHOTOS" : stockage temporaire des photos, le temps de la recherche Google Lens
#   (supprimées aussitôt après ; règle du bucket : suppression après 1 jour) ;
# - [[kv_namespaces]] binding "QUOTA" : compteur des recherches SerpApi du mois (global et par installation,
#   effacé de lui-même après 40 jours) et liste des installations (empreintes des jetons, jamais les jetons).

# Seuil mensuel de recherches SerpApi (offre gratuite : 250). Au seuil, /identify répond « quota_atteint ».
[vars]
SERPAPI_LIMITE_MOIS = "250"
# Seuil mensuel par installation ; vide = même seuil que le global (le global reste la limite dure).
SERPAPI_LIMITE_INSTALLATION = ""
# Version minimale de l'app (ex. "1.1.0") ; vide = aucune exigence. Une app plus ancienne reçoit
# « mise_a_jour_requise » (HTTP 426). Les APK d'avant l'étape 9 n'envoient pas leur version.
VERSION_APP_MIN = ""
